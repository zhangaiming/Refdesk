[package]
name = "refdesk"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A native Git workbench with a commit graph and spreadsheet diffs"

[dependencies]
anyhow = "1"
calamine = "0.31"
crossbeam-channel = "0.5"
dirs = "6"
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow"] }
globset = "0.4"
png = "0.18"
rfd = { version = "0.15", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
similar = "2.7"
tempfile = "3"

[build-dependencies]
embed-resource = "3.0"

[profile.release]
lto = "thin"
strip = true

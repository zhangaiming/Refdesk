name: Refdesk CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  windows:
    name: Windows Release
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc
      RUSTFLAGS: ${{ startsWith(github.ref, 'refs/tags/v') && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo fmt --check
      - name: Run Clippy
        run: cargo clippy --release --locked --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --release --locked
      - name: Package Windows x64 executable
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'refdesk').version
          if (!$version -or $env:GITHUB_REF_NAME -cne "v$version") {
            throw 'The Git tag must match the Cargo package version.'
          }
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $source = 'target/release/refdesk.exe'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $dumpbin = & $vswhere -latest -products '*' -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (!$dumpbin) { throw 'Visual Studio dumpbin was not found.' }
          $dependencies = & $dumpbin /dependents $source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dependencies
          if ($dependencies -match '^\s*(?:vcruntime\w*|ucrtbase|api-ms-win-crt-[\w-]+)\.dll\s*$') {
            throw 'The executable imports a dynamic C runtime.'
          }

          $directory = Join-Path $env:RUNNER_TEMP 'refdesk-package'
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          $name = "refdesk-$version-windows-x64.exe"
          $executable = Join-Path $directory $name
          Copy-Item -LiteralPath $source -Destination $executable
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $executable).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$executable.sha256", "$sha  $name`n")
      - name: Upload Windows x64 package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: refdesk-windows-x64
          path: ${{ runner.temp }}/refdesk-package/
          if-no-files-found: error
          retention-days: 7

name: Refdesk CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  windows:
    name: Windows Release
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo fmt --check
      - name: Run Clippy
        run: cargo clippy --release --locked --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --release --locked
